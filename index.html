<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dakwah Generator Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Stable UMD) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Serif+Arabic:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-arabic { font-family: 'Noto Serif Arabic', serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .dir-rtl { direction: rtl; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 20px; }
        
        @keyframes progress-indefinite {
            0% { transform: translateX(-100%); width: 30%; }
            50% { transform: translateX(50%); width: 40%; }
            100% { transform: translateX(100%); width: 30%; }
        }
        .animate-progress-indefinite {
            animation: progress-indefinite 2s infinite ease-in-out;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; }
            .min-h-screen { min-height: auto !important; }
            .max-w-7xl, .max-w-5xl { max-width: 100% !important; border: none !important; box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; }
            article { line-height: 1.8 !important; }
        }

        /* Responsive Fixes */
        .settings-panel {
            scrollbar-width: thin;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- KONFIGURASI API KEY (Load Balancer Sederhana) ---
        const apiKeys = [
            "AIzaSyD4j05g-mMfXYexu0-p5RzMZgv-5b7p0hg",
            "AIzaSyBP-jCWSpueJP1B2T22AX6mOaINHwYl-P8",
            "AIzaSyDNmr5NCFPrr6AHuJnkVVtk3fp0tiwrfIw"
        ];
        
        // Pilih satu key secara acak saat aplikasi dimuat
        const apiKey = apiKeys[Math.floor(Math.random() * apiKeys.length)];
        // --------------------------------------------------

        const AI_MODEL = "gemini-2.5-flash-preview-09-2025";

        // Optimized Icon Component for stable CDN usage
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    // Convert camelCase to kebab-case for Lucide data attribute
                    const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    iconRef.current.innerHTML = `<i data-lucide="${kebabName}" style="width: ${size}px; height: ${size}px;"></i>`;
                    window.lucide.createIcons({
                        attrs: {
                            class: className,
                            'stroke-width': 2
                        },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        function App() {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [loadingType, setLoadingType] = useState(""); 
            const [error, setError] = useState(null);
            const [generatedTitles, setGeneratedTitles] = useState([]);
            const [selectedTitle, setSelectedTitle] = useState("");
            const [generatedContent, setGeneratedContent] = useState("");
            
            const [selectedThemes, setSelectedThemes] = useState([]);
            const [formData, setFormData] = useState({
                jenis: 'Khutbah Jum\'at',
                gayaBahasa: 'Resmi dan Formal',
                bahasa: 'Indonesia',
                durasi: '15 Menit',
                judulKustom: '',
                instruksiKhusus: ''
            });

            const themeOptions = [
                "Tauhid & Aqidah", "Akhlak & Etika", "Adab Keseharian", 
                "Sabar & Syukur", "Muamalah Syariah", "Keluarga Sakinah", 
                "Fikih Ibadah", "Keadilan Sosial", "Sejarah & Sirah", 
                "Pemuda Muslim", "Ukhuwah Islamiyah", "Muslimah",
                "Zakat & Infaq", "Cinta Tanah Air", "Teknologi & Iman",
                "Kematian & Akhirat"
            ];

            const jenisOptions = [
                "Khutbah Jum'at", "Khutbah Idul Fitri", "Khutbah Idul Adha",
                "Khutbah Nikah", "Tausiyah Ramadhan", "Kultum Shubuh",
                "Tausiyah/Ceramah Umum", "Tausiyah Aqiqah", "Tausiyah Pemakaman"
            ];

            const gayaOptions = [
                "Resmi dan Formal", "Menyentuh Hati", "Puitis & Indah", "Kekinian (Relevan)", "Tegas & Lugas"
            ];

            const durasiOptions = [
                "7 Menit", "10 Menit", "15 Menit", "20 Menit", "30 Menit", "45 Menit"
            ];

            const handleAddTheme = (e) => {
                const theme = e.target.value;
                if (theme && !selectedThemes.includes(theme)) {
                    setSelectedThemes([...selectedThemes, theme]);
                }
                e.target.value = "";
            };

            const removeTheme = (themeToRemove) => {
                setSelectedThemes(selectedThemes.filter(t => t !== themeToRemove));
            };

            const callGemini = async (prompt, systemPrompt, isJson = false) => {
                if (!apiKey) {
                    throw new Error("API Key Gemini belum diisi. Silakan edit file index.html dan masukkan API Key Anda.");
                }
                let retries = 0;
                const maxRetries = 5;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };
                if (isJson) {
                    payload.generationConfig = {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                titles: { type: "ARRAY", items: { type: "STRING" } }
                            }
                        }
                    };
                }

                while (retries <= maxRetries) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API Error: Cek Koneksi atau Kuota API');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text;
                    } catch (err) {
                        if (retries === maxRetries) throw err;
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                        retries++;
                    }
                }
            };

            const generateTitles = async () => {
                if (selectedThemes.length === 0 && !formData.judulKustom) {
                    setError("Silakan pilih minimal satu tema utama.");
                    return;
                }
                setLoading(true);
                setLoadingType("titles");
                setError(null);
                const systemPrompt = "Anda adalah Ulama ahli dakwah. Tugas Anda membuat 10 judul khutbah/ceramah yang sangat inspiratif dan menyentuh.";
                const userPrompt = `Buat 10 judul untuk ${formData.jenis}. Tema: ${selectedThemes.join(", ")}. Gaya: ${formData.gayaBahasa}. Bahasa: ${formData.bahasa}. Format JSON: { "titles": [...] }`;
                try {
                    const res = await callGemini(userPrompt, systemPrompt, true);
                    setGeneratedTitles(JSON.parse(res).titles);
                    setStep(2);
                } catch (e) { setError(e.message || "Gagal membuat judul."); }
                finally { setLoading(false); }
            };

            const generateFullKhutbah = async (isDirect = false) => {
                const title = isDirect ? formData.judulKustom : selectedTitle;
                if (!title) return;
                setLoading(true);
                setLoadingType("content");
                setError(null);
                
                const systemPrompt = `Anda adalah Khatib profesional. Susun naskah lengkap (Khutbah 1 & 2 atau Ceramah). 
                STRUKTUR NASKAH:
                1. Prolog singkat yang menyatakan bahwa naskah telah berhasil dibuat.
                2. Pembukaan lengkap (Mukadimah Arab jika Khutbah).
                3. Isi materi yang mendalam, kaya dalil, dan terstruktur rapi.
                4. Penutup (Doa Arab jika Khutbah).

                ATURAN PENTING:
                - JANGAN menuliskan label seperti "Pembukaan:", "Isi:", atau "Penutup:".
                - JANGAN gunakan penanda Markdown seperti **bold**, ### heading, atau -- list.
                - Semua Teks Arab WAJIB diletakkan di dalam tag [ARABIC]teks arab[/ARABIC].
                - Panjang naskah harus disesuaikan dengan durasi waktu yang dipilih.`;

                const userPrompt = `Buat naskah lengkap untuk ${formData.jenis}. 
                Judul: "${title}". 
                Gaya: ${formData.gayaBahasa}. 
                Bahasa Pengantar: ${formData.bahasa}. 
                Estimasi Waktu/Durasi: ${formData.durasi}.
                Instruksi Tambahan: ${formData.instruksiKhusus}`;

                try {
                    const res = await callGemini(userPrompt, systemPrompt);
                    setGeneratedContent(res);
                    if (isDirect) setSelectedTitle(title);
                    setStep(3);
                } catch (e) { setError(e.message || "Gagal menyusun naskah."); }
                finally { setLoading(false); }
            };

            const renderContent = (content) => {
                const parts = content.split(/(\[ARABIC\].*?\[\/ARABIC\])/gs);
                return parts.map((part, i) => {
                    if (part.startsWith('[ARABIC]')) {
                        const text = part.replace(/\[\/?ARABIC\]/g, '');
                        return (
                            <div key={i} className="my-10 p-6 md:p-10 border-2 border-emerald-500/30 bg-emerald-50/50 rounded-3xl font-arabic text-3xl md:text-5xl leading-[2.2] text-center text-slate-900 dir-rtl shadow-sm ring-1 ring-emerald-100">
                                {text.trim()}
                            </div>
                        );
                    }
                    return <div key={i} className="mb-6 whitespace-pre-wrap text-slate-800 leading-relaxed font-serif text-lg md:text-xl">{part}</div>;
                });
            };

            const reset = () => {
                setStep(1);
                setGeneratedTitles([]);
                setSelectedTitle("");
                setGeneratedContent("");
                setSelectedThemes([]);
                setFormData({ ...formData, judulKustom: '', instruksiKhusus: '' });
            };

            const SettingsForm = ({ isSidebar = false }) => (
                <div className={`space-y-4 ${isSidebar ? 'text-sm' : ''}`}>
                    {/* Row 1: Tema & Jenis */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-2">
                            <label className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                <Icon name="Type" size={14} className="text-emerald-600" /> Tema Utama
                            </label>
                            <div className="relative">
                                <select onChange={handleAddTheme} defaultValue="" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 appearance-none text-slate-800 font-bold cursor-pointer transition-all text-sm">
                                    <option value="" disabled>-- Pilih Tema --</option>
                                    {themeOptions.filter(t => !selectedThemes.includes(t)).map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <Icon name="ChevronDown" size={16} />
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                                {selectedThemes.map(t => (
                                    <button key={t} onClick={() => removeTheme(t)} className="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-[10px] font-black border border-emerald-100 uppercase transition-all shadow-sm">
                                        {t} <Icon name="X" size={12} />
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-2">
                            <label className="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Jenis Dakwah</label>
                            <div className="relative">
                                <select value={formData.jenis} onChange={e => setFormData({...formData, jenis: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-800 appearance-none focus:ring-2 focus:ring-emerald-500 text-sm">
                                    {jenisOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <Icon name="ChevronDown" size={16} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Row 2: Gaya, Durasi, Bahasa */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="space-y-2">
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-wider ml-1">Gaya</label>
                            <div className="relative">
                                <select value={formData.gayaBahasa} onChange={e => setFormData({...formData, gayaBahasa: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-800 text-sm appearance-none">
                                    {gayaOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <Icon name="ChevronDown" size={14} />
                                </div>
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-wider ml-1">Durasi</label>
                            <div className="relative">
                                <select value={formData.durasi} onChange={e => setFormData({...formData, durasi: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-800 text-sm appearance-none">
                                    {durasiOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <Icon name="ChevronDown" size={14} />
                                </div>
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-wider ml-1">Bahasa</label>
                            <div className="relative">
                                <select value={formData.bahasa} onChange={e => setFormData({...formData, bahasa: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-800 text-sm appearance-none">
                                    {['Indonesia', 'Jawa', 'Sunda', 'Arab', 'Inggris'].map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <Icon name="ChevronDown" size={14} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Row 3: Judul & Instruksi */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-2">
                            <label className="text-xs font-black text-slate-700 uppercase tracking-widest ml-1 flex items-center gap-2">
                                <Icon name="PenTool" size={14} className="text-emerald-600" /> Judul
                            </label>
                            <input type="text" value={formData.judulKustom} onChange={e => setFormData({...formData, judulKustom: e.target.value})} placeholder="Isi judul..." className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-800 text-sm h-[80px]" />
                        </div>

                        <div className="space-y-2">
                            <label className="text-xs font-black text-slate-700 uppercase tracking-widest ml-1 flex items-center gap-2">
                                <Icon name="MessageCircle" size={14} className="text-emerald-600" /> Instruksi
                            </label>
                            <textarea value={formData.instruksiKhusus} onChange={e => setFormData({...formData, instruksiKhusus: e.target.value})} placeholder="Catatan tambahan..." className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 h-[80px] resize-none font-bold text-xs" />
                        </div>
                    </div>

                    <button onClick={formData.judulKustom ? () => generateFullKhutbah(true) : generateTitles} disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95 text-sm uppercase tracking-widest mt-2">
                        {loading ? <Icon name="Loader2" size={18} className="animate-spin" /> : <Icon name="Wand2" size={18} />}
                        <span>Generate</span>
                    </button>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col items-center">
                    {loading && loadingType === "content" && (
                        <div className="fixed inset-0 bg-white/95 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-8 text-center animate-in fade-in duration-500">
                            <div className="relative mb-12">
                                <div className="w-24 h-24 md:w-32 md:h-32 rounded-full border-[6px] border-slate-100 border-t-emerald-600 animate-spin"></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <Icon name="Sparkles" size={32} className="text-emerald-500" />
                                </div>
                            </div>
                            <h2 className="text-2xl md:text-3xl font-black text-slate-800 mb-6 tracking-tight">Menyusun Naskah Dakwah...</h2>
                            <div className="max-w-md space-y-4">
                                <p className="text-slate-500 text-base md:text-lg">Judul: <span className="text-emerald-700 font-bold block mt-1">"{selectedTitle || formData.judulKustom}"</span></p>
                                <div className="w-full bg-slate-100 h-1 rounded-full overflow-hidden mt-4">
                                    <div className="bg-emerald-500 h-full animate-progress-indefinite w-1/2"></div>
                                </div>
                                <p className="text-slate-400 text-xs md:text-sm leading-relaxed font-medium uppercase tracking-widest pt-2">Merangkai Materi sesuai Durasi {formData.durasi}</p>
                            </div>
                        </div>
                    )}
                    
                    <div className={`w-full ${step === 3 ? 'max-w-[1440px]' : 'max-w-5xl'} bg-white shadow-2xl md:rounded-[2.5rem] relative flex flex-col overflow-hidden min-h-screen md:min-h-[85vh] border border-slate-200 md:my-8`}>
                        <div className="p-6 md:p-8 bg-emerald-900 text-white flex items-center justify-between shadow-lg no-print">
                            <div className="flex items-center gap-4">
                                <div className="bg-white/10 p-3 rounded-2xl backdrop-blur-sm border border-white/10"><Icon name="BookOpen" size={28} /></div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black tracking-tight leading-none uppercase">AI Dakwah</h1>
                                    <p className="text-[10px] md:text-xs text-emerald-300 font-bold tracking-[0.3em] uppercase opacity-80 mt-1">Generator Naskah Pintar</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {step > 1 && <button onClick={() => setStep(step - 1)} className="p-3 bg-white/10 hover:bg-white/20 rounded-xl transition-all" title="Kembali"><Icon name="ChevronLeft" size={20} /></button>}
                                {step > 1 && <button onClick={reset} className="p-3 bg-white/10 hover:bg-white/20 rounded-xl transition-all" title="Reset"><Icon name="RotateCcw" size={20} /></button>}
                            </div>
                        </div>

                        {error && (
                            <div className="m-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 flex items-center gap-3 rounded-r-lg">
                                <Icon name="AlertCircle" size={20} />
                                <p className="text-sm font-medium">{error}</p>
                            </div>
                        )}

                        {(step === 1 || step === 2) && (
                            <div className="p-6 md:p-10 flex-1 flex flex-col items-center">
                                <div className="w-full max-w-4xl space-y-8">
                                    <div className="flex items-center gap-4">
                                        <div className="w-1.5 h-10 bg-emerald-600 rounded-full"></div>
                                        <h1 className="text-xl md:text-2xl font-black text-slate-800 uppercase tracking-tight">{step === 1 ? 'Settings' : 'Pilih Judul Khutbah'}</h1>
                                    </div>
                                    {step === 1 ? <div className="bg-white rounded-[2rem] border border-slate-100 p-6 md:p-8"><SettingsForm /></div> : (
                                        <div className="space-y-6">
                                            <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                                                {generatedTitles.map((title, index) => (
                                                    <button key={index} onClick={() => setSelectedTitle(title)} className={`w-full p-6 rounded-2xl border-2 text-left transition-all flex items-center gap-5 group shadow-sm ${selectedTitle === title ? 'border-emerald-500 bg-emerald-50/80 shadow-emerald-100 scale-[1.01]' : 'border-slate-100 bg-white hover:border-slate-200'}`}>
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-sm transition-colors shrink-0 ${selectedTitle === title ? 'bg-emerald-600 text-white' : 'bg-slate-50 text-slate-400'}`}>{index + 1}</div>
                                                        <span className={`text-base md:text-lg font-bold flex-1 leading-tight ${selectedTitle === title ? 'text-emerald-900' : 'text-slate-700'}`}>{title}</span>
                                                        {selectedTitle === title && <div className="text-emerald-600 animate-pulse shrink-0"><Icon name="MousePointer2" size={24} /></div>}
                                                    </button>
                                                ))}
                                            </div>
                                            <button onClick={() => generateFullKhutbah(false)} disabled={!selectedTitle || loading} className="w-full py-6 bg-emerald-600 text-white rounded-3xl font-black shadow-lg shadow-emerald-100 flex items-center justify-center gap-3 disabled:opacity-50 uppercase text-sm tracking-widest active:scale-95 transition-all">
                                                <Icon name="FileText" size={20} /><span>Generate</span>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="flex flex-col md:flex-row flex-1 overflow-hidden">
                                {/* SIDEBAR - LEFT ON DESKTOP */}
                                <aside className="w-full md:w-[350px] bg-slate-50 border-r border-slate-200 p-6 md:p-8 no-print md:sticky md:top-0 h-auto md:h-full overflow-y-auto custom-scrollbar settings-panel">
                                    <div className="flex items-center gap-3 mb-8 pb-4 border-b border-slate-200">
                                        <Icon name="Settings2" size={20} className="text-emerald-600" />
                                        <h2 className="font-black uppercase tracking-widest text-sm text-slate-700">Settings</h2>
                                    </div>
                                    <SettingsForm isSidebar={true} />
                                </aside>
                                
                                {/* CONTENT - RIGHT ON DESKTOP */}
                                <main className="flex-1 bg-white p-6 md:p-16 overflow-y-auto">
                                    <div className="max-w-3xl mx-auto w-full">
                                        <div className="flex justify-between items-start mb-12 border-b-4 border-emerald-500/20 pb-8 no-print">
                                            <h2 className="text-3xl md:text-5xl font-black text-slate-900 leading-tight tracking-tighter flex-1">{selectedTitle}</h2>
                                            <div className="flex gap-2 ml-4">
                                                <button onClick={() => window.print()} className="p-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-all" title="Print / PDF"><Icon name="Download" size={20} /></button>
                                                <button onClick={() => { const el = document.createElement('textarea'); el.value = generatedContent.replace(/\[\/?ARABIC\]/g, ''); document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); }} className="p-3 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl transition-all" title="Salin Naskah"><Icon name="CheckCircle2" size={20} /></button>
                                            </div>
                                        </div>
                                        <h2 className="hidden print:block text-4xl font-black text-center mb-10">{selectedTitle}</h2>
                                        <article className="font-serif text-lg md:text-2xl leading-[2.3] text-slate-800 text-justify">
                                            {renderContent(generatedContent)}
                                        </article>
                                    </div>
                                </main>
                            </div>
                        )}
                        
                        <div className="p-4 text-center border-t border-slate-50 no-print mt-auto">
                            <p className="text-slate-300 text-[10px] font-bold uppercase tracking-[0.5em]">AI Dakwah Generator • Naskah Digital Islami</p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
